[tool.poetry]
name = "online-store-project"
version = "0.1.0"
description = "Online store management system"
authors = ["Vic.M <viktormitin55221@gmail.com>"]
readme = "README.md"
packages = [{include = "src", from = "."}]

[tool.poetry.dependencies]
python = "^3.14"
pandas = "^2.3.3"
numpy = "^2.3.4"
requests = "^2.32.5"
fastapi = "^0.121.0"
uvicorn = {extras = ["standard"], version = "^0.38.0"}
sqlalchemy = "^2.0.44"
pydantic = "^2.12.3"
python-jose = {extras = ["cryptography"], version = "^3.5.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
python-multipart = "^0.0.20"
python-dotenv = "^1.2.1"
email-validator = "^2.3.0"
store = "^2020.2.10"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.2"
pytest-cov = "^7.0.0"
pytest-asyncio = "^0.21.0"
httpx = "^0.25.0"
flake8 = "^7.3.0"
mypy = "^1.18.2"
black = "^25.9.0"
isort = "^7.0.0"
pre-commit = "^3.4.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 119
target-version = ['py314']

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 119

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
namespace_packages = true
mypy_path = "src"
exclude = [
    'tests/',
    'build/',
    'dist/',
    '\.venv/',
    '.*/__pycache__/',
]
follow_imports = "skip"

[[tool.mypy.overrides]]
module = [
    "pytest",
    "_pytest.*",
    "pytest_cov",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "store.*"
ignore_errors = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["src", "."]
addopts = "--cov=src --cov-report=term-missing"

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*"]

